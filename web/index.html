<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanza Personale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calmo, preciso, da app finanziaria seria. IDEA: un cruscotto da private banking, numeri grandi su fondo scuro.
   PICTURE: il patrimonio e i saldi dei conti in grande, grafici sottili che si disegnano.
   COLOUR: scuro grafite con un accento lime (versione chiara: carta bianca, stesso lime). TYPE: Manrope per i numeri e i titoli, Inter per il testo.
   LAYOUT: telefono a una colonna con barra in basso; da 1024px menu a sinistra e contenuti su due colonne. */
:root {
  --bg: #0e0f11; --surface: #17181b; --surface-2: #1f2125; --surface-3: #282a2f; --ink: #f2f1ec; --ink-2: #bdbcb5; --ink-3: #8b8a84;
  --line: #2a2c31; --line-2: #383a40;
  --accent: #b5e26a; --accent-ink: #13180b; --accent-soft: rgb(181 226 106 / .13); --acc-txt: #c2ea7e; --acc-line: #b5e26a;
  --in: #5fd3a0; --out: #ff8a65; --inv: #a594ff;
  --good: #8fdc6a; --warn: #f2c14e; --crit: #ff6b6b; --warn-soft: rgb(242 193 78 / .14); --crit-soft: rgb(255 107 107 / .14); --good-soft: rgb(143 220 106 / .14); --todo: #ffa25c; --todo-soft: rgb(255 162 92 / .14);
  --shadow: none; --shadow-pop: 0 18px 50px rgb(0 0 0 / .55);
  --scrim: rgb(0 0 0 / .6);
  color-scheme: dark;
  --font-display: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --radius: 18px;
  --ease: cubic-bezier(.22, .8, .24, 1);
}
:root[data-app-theme="light"] {
  --bg: #f3f3ef; --surface: #ffffff; --surface-2: #f1f0ea; --surface-3: #e7e6df; --ink: #16171a; --ink-2: #4b4d53; --ink-3: #74767c;
  --line: #e3e2db; --line-2: #d2d1c9;
  --accent: #a6dc54; --accent-ink: #14200a; --accent-soft: rgb(120 178 40 / .14); --acc-txt: #3f6d0f; --acc-line: #5f9a1d;
  --in: #11926a; --out: #e0602f; --inv: #5b4bd0;
  --good: #2f7d18; --warn: #9a6400; --crit: #c8372f; --warn-soft: #fbefd2; --crit-soft: #fbe1df; --good-soft: #e1f1d4; --todo: #c4500c; --todo-soft: #ffe8da;
  --shadow: 0 1px 2px rgb(20 22 26 / .04), 0 6px 22px rgb(20 22 26 / .05); --shadow-pop: 0 18px 50px rgb(20 22 26 / .18);
  --scrim: rgb(20 22 26 / .38);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: clip; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .amt, td.n { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.015em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
::selection { background: var(--accent); color: var(--accent-ink); }

/* ---------- Struttura ---------- */
.app { display: flex; flex-direction: column; height: 100%; }
header.top { background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; position: relative; z-index: 4; }
.top-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font: 800 16px var(--font-display); flex: none; }
.brand h1 { font-size: 17px; font-weight: 800; }
.pagetitle { display: none; font-size: 24px; font-weight: 800; }
.iconbtn.gear { position: relative; background: transparent; border-color: transparent; color: var(--ink-2); }
.gear svg { width: 22px; height: 22px; }
.gear .badge { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.monthnav { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.monthnav:empty { display: none; }
.monthnav .lbl { min-width: 128px; text-align: center; font: 700 15px var(--font-display); text-transform: capitalize; }
.iconbtn { border: 1px solid var(--line); background: var(--surface-2); width: 36px; height: 36px; border-radius: 11px; cursor: pointer; display: grid; place-items: center; font-size: 18px; line-height: 1; }
.iconbtn:disabled { opacity: .35; cursor: default; }
main { flex: 1; overflow-y: auto; padding: 16px 16px 28px; overscroll-behavior: contain; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
nav.tabs { background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); position: relative; z-index: 4; }
.navbrand, .navfoot { display: none; }
.tabs-inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tab { border: 0; background: none; padding: 7px 2px 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); cursor: pointer; position: relative; }
.tab svg { width: 23px; height: 23px; transition: transform .25s var(--ease); }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--acc-line); transform: translateY(-1px); }
.tab[aria-current="page"]::after { content: ''; position: absolute; top: -7px; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }

/* ---------- Schede e blocchi ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 17px; font-weight: 800; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.sub { color: var(--ink-3); font-size: 13px; }
.sh3 { font: 700 12.5px var(--font-body); color: var(--ink-3); letter-spacing: .02em; margin: 4px 0 8px; }
.banner { border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
.banner.demo { background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner.info { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
.banner b { font-weight: 600; }

/* Patrimonio in cima alla Panoramica */
.patrimonio { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px 20px 18px; box-shadow: var(--shadow); }
.patrimonio .k { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.patrimonio .v { display: block; font: 800 clamp(34px, 10vw, 46px)/1.08 var(--font-display); letter-spacing: -0.035em; font-variant-numeric: tabular-nums; margin-top: 4px; overflow-wrap: anywhere; }

.hero { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 15px 14px 13px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; text-align: left; min-width: 0; box-shadow: var(--shadow); font: inherit; color: inherit; }
.kpi .k { font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
.kpi .k svg { width: 26px; height: 26px; padding: 5px; border-radius: 9px; color: var(--kpi-c, var(--ink-2)); background: color-mix(in srgb, var(--kpi-c, var(--ink-3)) 16%, transparent); flex: none; }
.kpi.in { --kpi-c: var(--in); } .kpi.out { --kpi-c: var(--out); } .kpi.inv { --kpi-c: var(--inv); } .kpi.goal { --kpi-c: var(--accent); }
.kpi .v { font: 800 clamp(20px, 5.6vw, 26px)/1.15 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.025em; overflow-wrap: anywhere; }
.kpi.big .v { font-size: clamp(24px, 7vw, 32px); }
.kpi .v.small { font-size: 16px; font-weight: 700; letter-spacing: 0; }
.kpi .d { font-size: 12.5px; color: var(--ink-3); }
.kpi .progress { margin: 4px 0 2px; height: 6px; }
button.kpi { cursor: pointer; transition: border-color .2s, transform .2s var(--ease); }
button.kpi:hover { border-color: var(--line-2); }
button.kpi:active { transform: scale(.985); }
.hero-foot { grid-column: 1 / -1; display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--ink-2); padding: 2px 4px; }
.hero-foot b { color: var(--ink); font-variant-numeric: tabular-nums; }
.linkbtn { border: 0; background: var(--todo-soft); color: var(--todo); border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
.linkbtn.plain { background: none; color: var(--ink-3); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.segbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 13px; padding: 11px 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.segbtn span { font-size: 12px; color: var(--ink-3); }
.segbtn[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }

/* ---------- Pulsanti e campi ---------- */
.btn { border: 1px solid var(--line-2); background: var(--surface-2); padding: 10px 15px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; min-height: 42px; transition: background .15s, border-color .15s, transform .15s var(--ease); }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--crit); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 7px 11px; font-size: 13px; min-height: 34px; border-radius: 10px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters input, .filters select { flex: 1 1 160px; min-width: 0; }
textarea, input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], input[type="month"], select {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; font-size: 16px; min-height: 44px; width: 100%; transition: border-color .15s, box-shadow .15s;
}
textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
textarea { resize: vertical; line-height: 1.4; }
.f { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 460px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.tile .k { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tile .v { font: 800 21px var(--font-display); font-variant-numeric: tabular-nums; }
.tile .d { font-size: 12px; color: var(--ink-3); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* ---------- Grafici ---------- */
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .axis { fill: var(--ink-3); font-size: 11px; font-family: var(--font-body); }
.chart .axis.sel { fill: var(--ink); font-weight: 700; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bar { transform-box: fill-box; transform-origin: bottom; }
.tip { position: absolute; pointer-events: none; background: var(--surface-3); color: var(--ink); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px 11px; font-size: 12.5px; line-height: 1.55; min-width: 150px; box-shadow: var(--shadow-pop); z-index: 5; }
.tip b { font-weight: 600; }
.tip .row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.chart .xh, .chart .tip { pointer-events: none; }

.catbars { display: flex; flex-direction: column; gap: 2px; }
.catrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px; margin: 0 -8px; border-radius: 12px; cursor: pointer; border: 0; background: none; text-align: left; width: calc(100% + 16px); align-items: center; }
.catrow:hover { background: var(--surface-2); }
.catrow .ci { grid-row: span 3; align-self: start; }
.catrow .nm { font-size: 14px; font-weight: 600; }
.catrow .vl { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.catrow .track { grid-column: 2 / -1; position: relative; height: 8px; background: var(--surface-2); border-radius: 4px; }
.catrow .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--out); border-radius: 4px; }
.catrow .budget-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.catrow .meta { grid-column: 2 / -1; font-size: 12px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Icone delle categorie */
.ci { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; color: var(--ci-c, var(--ink-2)); background: color-mix(in srgb, var(--ci-c, var(--ink-3)) 16%, transparent); }
.ci svg { width: 18px; height: 18px; }
.ci.t-in { --ci-c: var(--in); } .ci.t-out { --ci-c: var(--out); } .ci.t-inv { --ci-c: var(--inv); } .ci.t-skip { --ci-c: var(--ink-3); } .ci.t-todo { --ci-c: var(--todo); }
.ci.sm { width: 28px; height: 28px; border-radius: 9px; } .ci.sm svg { width: 15px; height: 15px; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.cat { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); font-weight: 500; }
.chip.cat.todo { background: var(--todo-soft); color: var(--todo); border-color: var(--todo); font-weight: 700; }
.chip.auto { background: var(--accent-soft); color: var(--acc-txt); }
.tx.todo, .prow.todo { box-shadow: inset 3px 0 0 var(--todo); background: linear-gradient(90deg, var(--todo-soft), transparent 85%); padding-left: 12px; padding-right: 6px; border-radius: 8px; }
select.todo { border-color: var(--todo); background: var(--todo-soft); color: var(--todo); font-weight: 600; }
.todo-t { color: var(--todo); font-weight: 700; }
.memo { color: var(--good); font-weight: 600; }
.tile.todo { border-color: var(--todo); background: var(--todo-soft); }
.tile.todo .v, .tile.todo .k { color: var(--todo); }
button.chip { cursor: pointer; border: 0; }

/* ---------- Movimenti ---------- */
.plist { margin-top: 10px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.prow:last-child { border-bottom: 0; }
.prow .ds { font-size: 14px; overflow-wrap: anywhere; }
.prow .amt { font-weight: 600; font-size: 14.5px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.prow .amt.pos { color: var(--good); }
.prow .pctl { grid-column: 1 / -1; display: flex; gap: 6px; }
.prow .pctl select { flex: 1; min-width: 0; min-height: 38px; padding: 6px 8px; font-size: 14px; }
.prow .pctl .iconbtn { width: 38px; height: 38px; flex: none; font-size: 15px; }
.daygroup h3 { font: 600 12.5px var(--font-body); color: var(--ink-3); text-transform: capitalize; margin: 10px 0 2px; }
.tx { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; align-items: center; border-radius: 0; transition: background .15s; }
.tx:hover { background: var(--surface-2); }
.tx:last-child { border-bottom: 0; }
.tx .ci { grid-row: span 2; }
.tx .ds { font-size: 14.5px; font-weight: 500; overflow-wrap: anywhere; }
.tx .amt { font-weight: 700; font-size: 15px; text-align: right; white-space: nowrap; font-family: var(--font-display); }
.tx .amt.pos { color: var(--good); }
.tx .amt.neu { color: var(--ink-2); }
.tx .row2 { grid-column: 2 / -1; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); }
.tx .c-date, .tx .c-cat, .tx .c-acct, .tx .ds .vchk, .tx .ds .chip { display: none; }
.txhead { display: none; }
.addspend { width: 100%; min-height: 56px; font-size: 17px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.addspend span { font-size: 24px; line-height: 1; }
.addother { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
.vchk { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: var(--good-soft); color: var(--good); font-weight: 800; font-size: 12px; cursor: pointer; }
.paychips { display: flex; flex-wrap: wrap; gap: 8px; }
.paychips button { border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; min-height: 40px; transition: background .15s, border-color .15s; }
.paychips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.paychips button .dot { width: 8px; height: 8px; }
.sughint { font-size: 12.5px; color: var(--acc-txt); font-weight: 500; margin-left: 4px; }
.vsec h3 { font: 700 14px var(--font-display); margin: 14px 0 4px; }
.vpair { grid-column: 1 / -1; display: grid; gap: 4px; font-size: 12.5px; }
.vpair div { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; overflow-wrap: anywhere; }
.vpair b { font-weight: 600; }
.prow.chk { box-shadow: inset 3px 0 0 var(--warn); padding-left: 12px; border-radius: 8px; }
.prow.ok .ds::before { content: '✓ '; color: var(--good); font-weight: 800; }
.txgroups { display: flex; flex-direction: column; }
.mhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font: 800 15px var(--font-display); margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--line); text-transform: capitalize; }
.mhead:first-child { border-top: 0; padding-top: 0; margin-top: 8px; }
.mhead span { font: 600 12.5px var(--font-body); color: var(--ink-3); text-transform: none; font-variant-numeric: tabular-nums; }
.banner.dup { background: var(--todo-soft); border: 1px solid var(--todo); color: var(--ink); }
.banner.dup b { color: var(--todo); }
.dupof { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 6px 8px; overflow-wrap: anywhere; }
.dupof b { color: var(--ink); font-weight: 600; }
.chip.dupchip { background: var(--todo-soft); color: var(--todo); }
details.dups summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--todo); margin-top: 12px; }

.progress { height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; overflow: hidden; }
.progress > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }

/* ---------- Importa ---------- */

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }

ol.steps { margin: 0; padding-left: 20px; color: var(--ink-2); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }

/* ---------- Finestre ---------- */
.sheet-bg { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 20; animation: fadeIn .2s ease both; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 92%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); border-bottom: 0; box-shadow: var(--shadow-pop); animation: sheetUp .34s var(--ease) both; }

@media (min-width: 620px) { .sheet-bg { align-items: center; padding: 20px; } .sheet { border-radius: 22px; border-bottom: 1px solid var(--line); padding-top: 20px; animation-name: popIn; max-height: 88vh; } .sheet::before { display: none; } }
.sheet h2 { font-size: 20px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 500; z-index: 30; width: max-content; max-width: calc(100% - 32px); box-shadow: var(--shadow-pop); display: flex; align-items: center; gap: 10px; animation: toastIn .3s var(--ease) both; }

/* ---------- Investimenti ---------- */

/* ---------- Animazioni ---------- */
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetUp { from { transform: translateY(100%); } }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.97); } }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 14px); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes growX { from { transform: scaleX(0); } }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-soft); } 100% { box-shadow: 0 0 0 14px transparent; } }
@media (prefers-reduced-motion: no-preference) {
  .wrap.enter > * { animation: viewIn .42s var(--ease) both; }
  .wrap.enter > *:nth-child(2) { animation-delay: .04s; } .wrap.enter > *:nth-child(3) { animation-delay: .08s; } .wrap.enter > *:nth-child(4) { animation-delay: .12s; } .wrap.enter > *:nth-child(n+5) { animation-delay: .16s; }
  .wrap.enter .catrow .fill, .wrap.enter .progress > i { transform-origin: left; animation: growX .8s .15s var(--ease) both; }
  .wrap.enter .chart .bar { animation: growY .7s var(--ease) both; }
  .wrap.enter .acard { animation: rise .45s var(--ease) both; }
  .chart path.drawn { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.1s .1s ease-out forwards; }
  .flash { animation: pulse .9s ease-out; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-bg, .toast { animation: none; } }

/* ---------- Classificazione ---------- */
function merchantKeys(desc) {
  const full = norm(desc).replace(/\d{1,2}[\/.\-]\d{1,2}([\/.\-]\d{2,4})?/g, ' ').replace(/[*#:;,()\[\]]/g, ' ').replace(/\b\w*\d\w*\b/g, ' ').replace(/\s+/g, ' ').trim();

}
// Memoria dei movimenti già classificati: stessa descrizione/esercente -> stessa categoria
function buildHistory() {
  const counts = {};
  for (const t of allTx()) {
    if (!t.c || t.c === 'da-classificare' || !S.settings.cats.some(c => c.id === t.c)) continue;
    const sg = t.a > 0 ? '+' : '-';
    for (const k of merchantKeys(t.s)) { const key = sg + k; const m = counts[key] = counts[key] || {}; m[t.c] = (m[t.c] || 0) + 1; }
  }
  const out = {};
  for (const [k, v] of Object.entries(counts)) out[k] = Object.entries(v).sort((a, b) => b[1] - a[1])[0][0];
  return out;
}

  if (!hist) return null;

  for (const k of merchantKeys(desc)) { const c = hist[sg + k]; if (c) return c; }
  return null;
}
function categorize(desc, amount, hist) {
  const d = norm(desc);
  for (const r of (S.settings && S.settings.rules) || []) if (r.k && d.includes(r.k)) return r.c;
  for (const [cid, re, test] of FIXED_RULES) if (re.test(desc) && (!test || test(amount))) return cid;
  const hc = fromHistory(desc, amount, hist); if (hc) return hc;
  for (const [cid, re] of BUILTIN_RULES) {
    if (!re.test(desc)) continue;
    const c = catById(cid);
    if (c.t === 'in' && amount < 0) continue;
    return cid;
  }
  return amount > 0 ? 'altre-entrate' : 'da-classificare';
}
function suggestKeyword(desc) {
  let s = norm(desc)
    .replace(/\b(pagamento|pagam\.?|pag\.?|pos|carta|card|debit[oa]?|addebito|sdd|sepa|bonifico|a vostro favore|a favore di|disposto|operazione|op\.|acquisto|presso|del|n\.|nr\.?|ore|contactless|apple pay|google pay|mastercard|visa|maestro|circuito|eur|euro|data|valuta)\b/g, ' ')
    .replace(/\d{1,2}[\/.\-]\d{1,2}([\/.\-]\d{2,4})?/g, ' ')
    .replace(/[*#:;,()\[\]]/g, ' ')
    .replace(/\b\w*\d\w*\b/g, ' ')
    .replace(/\s+/g, ' ').trim();
  const words = s.split(' ').filter(w => w.length >= 3);
  return words.slice(0, 2).join(' ') || norm(desc).slice(0, 20);
}

function afterRender(view) {

    const to = +el.dataset.count, k = el.dataset.k || '', f = el.dataset.f === 'eur' ? eur : eur0;
    const had = k in S.cnt; const from = had ? S.cnt[k] : 0; S.cnt[k] = to;
    if (reduceMotion() || !isFinite(to) || (had && Math.abs(from - to) < 0.005) || (!had && !S.anim)) { el.textContent = f(to); return; }
    const t0 = performance.now(), dur = had ? 650 : 900;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = f(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
    el.textContent = f(from); requestAnimationFrame(step);

  });
}

function drawMonthly() {

  const mw = monthsWithData();

  const sel = isYear() ? null : S.ym;

    if (months.length < 2) months = [addMonths(S.ym, -1), S.ym];
  }
  const data = months.map(m => { const s = monthStats(m); return { m, inc: s.inc, out: s.out, inv: s.inv }; });
  const W = Math.max(280, box.clientWidth || 320), H = 210, L = 44, R = 6, T = 10, B = 26;
  const rawMax = Math.max(1, ...data.map(d => Math.max(d.inc, d.out)));
  const step = niceStep(rawMax / 4); const max = Math.ceil(rawMax / step) * step;
  const y = v => T + (H - T - B) * (1 - v / max);
  const gw = (W - L - R) / data.length; const bw = Math.max(4, Math.min(16, gw * 0.3));
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${isYear() ? `Entrate e uscite mese per mese nel ${curYear()}` : `Entrate e uscite degli ultimi ${data.length} mesi`}">`;
  for (let v = 0; v <= max + 0.001; v += step) svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${compact(v)} €</text>`;
  data.forEach((d, i) => {
    const cx = L + gw * i + gw / 2;
    if (d.m === sel) svg += `<rect x="${L + gw * i + 1}" y="${T}" width="${gw - 2}" height="${H - T - B}" rx="8" fill="var(--accent-soft)"/>`;

    if (d.out > 0) svg += `<path class="bar" style="animation-delay:${(i * 0.035 + 0.02).toFixed(2)}s" d="${barPath(x2, y(d.out), bw, y(0) - y(d.out), 4)}" fill="var(--out)"/>`;

    if (showLab) svg += `<text class="axis ${d.m === sel ? 'sel' : ''}" x="${cx}" y="${H - 8}" text-anchor="middle">${esc(lab)}</text>`;
    svg += `<rect x="${L + gw * i}" y="0" width="${gw}" height="${H}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;
  });
  svg += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink-3)" stroke-width="1"/></svg>`;
  box.innerHTML = svg + '<div class="tip" hidden></div>';
  const tip = box.querySelector('.tip');

    const d = data[i]; if (!d) return;

function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

function viewBudget() {

function previewCard(imp) {

  if (isText && !imp.parsed.length) return '';
  const parsed = imp.parsed;
  imp.force = imp.force || {};
  imp.same = imp.same || {};
  const dups = findDuplicates(parsed);
  const fresh = parsed.filter(t => !dups.has(t.id) || imp.force[t.id]);
  const kind = t => dups.has(t.id) ? dups.get(t.id).type : '';
  const checks = parsed.filter(t => kind(t) === 'check');
  const confirms = parsed.filter(t => kind(t) === 'confirm');
  const dupList = parsed.filter(t => ['exact', 'likely'].includes(kind(t)));

      <span class="sub">${fmtD(t.d)}${t._mem ? ' · <span class="memo">come le volte scorse</span>' : ''}${t.c === 'da-classificare' ? ' · <b class="todo-t">senza categoria</b>' : ''}${imp.force[t.id] ? ' · <span class="chip dupchip">doppione importato comunque</span>' : ''}</span>

      <span class="pctl"><button class="btn small ${forced ? '' : 'ghost'}" data-act="impforce" data-v="${t.id}">${forced ? '✓ Lo importo · annulla' : 'Non è un doppione: importalo'}</button></span>
    </div>`;
  }).join('');
  const fmtA = t => `${t.a > 0 ? '+' : ''}${eur(t.a)}`;
  const openChecks = checks.filter(t => !imp.same[t.id] && !imp.force[t.id]).length;
  const checkRows = checks.map(t => { const m = dups.get(t.id).m, same = !!imp.same[t.id], sep = !!imp.force[t.id];
    return `<div class="prow chk">
      <span class="ds">${esc(t.s)}</span><span class="amt">${fmtA(t)}</span>
      <span class="vpair"><div>Estratto: <b>${fmtD(t.d)}</b> · ${esc(t.s)} · <b>${eur(t.a)}</b></div><div>La tua spesa: <b>${fmtD(m.d)}</b> · ${esc(m.s)} · <b>${eur(m.a)}</b></div></span>

  const checkBlock = checks.length ? `<div class="vsec"><h3>Da verificare (${checks.length})</h3>

const acctById = id => (S.settings.accts || []).find(a => a.id === id);

// Scala (delta negativo) o restituisce (delta positivo) l'importo sul saldo del conto
function applyBal(acId, delta) {
  const a = acctById(acId); if (!a || !delta) return;
  a.v = round2((+a.v || 0) + delta); syncCash(); Store.saveSettings();
}
// Come applyBal, per un movimento del giorno d: se il conto ha la ricarica automatica "fino a X €"
// e la ricarica successiva non è ancora confermata dall'estratto, la ricarica assorbe la differenza.
function applyMov(acId, delta, d) {
  applyBal(acId, delta);
  const a = acctById(acId); if (!a || !a.top || a.top.mode === 'add' || !delta || !isDate(d)) return;
  const next = allTx().filter(t => t.top === a.id && t.ac2 === a.id && !t.v && t.pd > d).sort(byDate)[0];
  if (!next) return;
  const f = findTx(next.id); if (!f) return;
  const old = -f.t.a, amt = round2(Math.max(0, old - delta)); if (Math.abs(amt - old) < 0.005) return;
  f.t.a = -amt; applyBal(f.t.ac, -(amt - old)); applyBal(a.id, amt - old); Store.saveMonth(f.ym);
}
// Chip dei conti: "cash" vuol dire contanti non registrati (o nessun conto) e non tocca i saldi
function acctChips(sel, act, opts = {}) {

    + (opts.noCash ? '' : `<button type="button" class="${sel === 'cash' ? 'on' : ''}" data-act="${act}" data-v="cash" aria-pressed="${sel === 'cash'}">${hasCashAcct() ? 'Nessun conto' : 'Contanti'}</button>`);
}

  const main = accts.find(a => a.t === 'cc') || accts.find(a => a.t === 'card') || accts[0];

}
const payChips = sel => acctChips(sel, 'spacct');

  if (/\.pdf$/.test(name) || type === 'application/pdf') return handlePdf(file);
  if (/^image\//.test(type) || /\.(png|jpe?g|webp|heic|heif)$/.test(name)) return handleImages([file]);

/* ---------- PDF, testo incollato, immagini ---------- */
function loadPdfJS() {
  if (window.pdfjsLib) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(); } catch (e) { rej(e); } };
    s.onerror = () => rej(new Error('lettore PDF non caricato'));
    document.head.appendChild(s);
  });
}
function groupPdfLines(items, page) {
  const rows = [];
  for (const it of items) {
    const s = it.str; if (!s || !s.trim()) continue;
    const x = it.transform[4], y = it.transform[5], w = it.width || 0;
    let r = rows.find(r => Math.abs(r.y - y) < 3);
    if (!r) { r = { y, items: [] }; rows.push(r); }
    r.items.push({ x, xc: x + w / 2, xe: x + w, s });
  }
  rows.sort((a, b) => b.y - a.y);
  return rows.map(r => {
    r.items.sort((a, b) => a.x - b.x);
    let text = '', prevEnd = null;
    for (const i of r.items) { if (prevEnd !== null) text += i.x - prevEnd > 6 ? '   ' : (i.x - prevEnd > 0.8 ? ' ' : ''); text += i.s; prevEnd = i.xe; }
    return { text: text.trim(), items: r.items, page };
  });
}
async function renderPdfPages(pdf, max) {
  const out = [];
  for (let p = 1; p <= Math.min(pdf.numPages, max); p++) {
    const page = await pdf.getPage(p); const vp = page.getViewport({ scale: 1.7 });
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85)); if (blob) out.push(blob);
  }
  return out;
}
async function handlePdf(file) {
  toast('Leggo il PDF…');
  try {
    await loadPdfJS();
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
    const lines = [];
    for (let p = 1; p <= Math.min(pdf.numPages, 40); p++) { const page = await pdf.getPage(p); const tc = await page.getTextContent(); lines.push(...groupPdfLines(tc.items, p)); }
    const text = lines.map(l => l.text).join('\n');
    if (text.replace(/\s/g, '').length < 40) {
      const images = await renderPdfPages(pdf, 5);
      startTextImport({ source: file.name || 'PDF', images });
      return;
    }
    startTextImport({ source: file.name || 'PDF', text, parsed: parseStatementLines(lines) });
  } catch (e) {
    toast(e && e.name === 'PasswordException' ? 'Il PDF è protetto da password: aprilo e copia il testo.' : 'Non riesco a leggere il PDF: ' + (e && e.message || 'errore'));
  }
}
function handleImages(files) {
  const imgs = files.filter(f => f && (/^image\//.test(f.type) || /\.(png|jpe?g|webp|heic|heif)$/i.test(f.name || ''))).slice(0, 5);
  if (!imgs.length) return;
  startTextImport({ source: imgs.length > 1 ? `${imgs.length} screenshot` : 'Screenshot', images: imgs });
}
function readPasted() {
  const ta = $('#paste'); const text = ta ? ta.value : '';
  if (!text.trim()) { toast('Prima incolla il testo dell\'estratto conto nel riquadro.'); return; }
  // Dati copiati da Excel/CSV: righe con separatori costanti e un'intestazione riconoscibile
  const ls = text.split(/\r?\n/).filter(l => l.trim());
  const sepLines = ls.filter(l => /\t|;/.test(l)).length;
  if (ls.length >= 2 && sepLines / ls.length > 0.7) {
    const rows = parseCSV(text); const hi = findHeader(rows); const m = guessMap(rows[hi] || []);
    if (m.date >= 0 && (m.amount >= 0 || (m.inc >= 0 && m.out >= 0))) { startTableImport(rows, 'Tabella incollata'); return; }
  }
  startTextImport({ source: 'Testo incollato', text, parsed: parseStatementLines(text.split(/\r?\n/).map(t => ({ text: t }))) });

const MESI = { gen: 1, feb: 2, mar: 3, apr: 4, mag: 5, giu: 6, lug: 7, ago: 8, set: 9, ott: 10, nov: 11, dic: 12, jan: 1, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, dec: 12 };
const DATE_RE = /(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})(?!\d)|(\d{1,2})\s+(gen|feb|mar|apr|mag|giu|lug|ago|set|ott|nov|dic|jan|may|jun|jul|aug|sep|oct|dec)[a-z]*\.?\s+(\d{4})/i;
const AMT_RE = /(^|[\s(€:|])([-+−–]?)\s?(?:€|EUR)?\s?((?:\d{1,3}(?:[.'\s]\d{3})+|\d+),\d{2})(?:\s?(?:€|EUR))?(\s?[-+])?(?=$|[\s)€|;])/gi;
function dateFromMatch(m) {
  if (m[1]) { let y = +m[3]; if (y < 100) y += 2000; return parseDate(`${m[1]}/${m[2]}/${y}`); }
  const mo = MESI[m[5].toLowerCase().slice(0, 3)]; return mo ? parseDate(`${m[4]}/${mo}/${m[6]}`) : null;
}
const POS_RE = /accredit|a (vostro|tuo|suo) favore|stipend|emolument|bonifico (da|ricevuto|in entrata)|ricevut|rimbors|storno|interessi (creditori|attivi)|versamento|in entrata|cashback|saveback|dividend|giroconto da/i;
function parseStatementLines(lines) {
  let header = null; const blocks = []; let cur = null;
  for (const ln of lines) {
    const t = (ln.text || '').trim(); const nt = norm(t);
    if (!t) { continue; }
    if (/(dare|addebit|uscit)/.test(nt) && /(avere|accredit|entrat)/.test(nt) && !DATE_RE.test(t.slice(0, 14))) {
      if (ln.items) {
        const col = re => { const it = ln.items.find(i => re.test(norm(i.s))); return it ? it.xc : null; };
        header = { out: col(/dare|addebit|uscit/), inc: col(/avere|accredit|entrat/), saldo: col(/saldo/) };
      }
      cur = null; continue;
    }
    const dm = t.match(DATE_RE);
    if (dm && dm.index <= 14) { cur = { date: dateFromMatch(dm), lines: [ln], header }; blocks.push(cur); }
    else if (cur && cur.lines.length < 6 && !/^(pagina|pag\.|saldo|totale|riporto|segue|estratto conto)/.test(nt)) cur.lines.push(ln);
    else cur = null;
  }
  const out = [];
  for (const b of blocks) {
    if (!b.date) continue;
    const amts = [];
    b.lines.forEach((ln, li) => {
      const txt = ln.text; AMT_RE.lastIndex = 0; let m;
      while ((m = AMT_RE.exec(txt))) {
        const raw = m[3]; const val = parseAmt(raw.replace(/[' ]/g, '.'));
        if (!isFinite(val)) continue;
        let x = null;
        if (ln.items) { const it = ln.items.find(i => i.s.includes(raw)); if (it) x = it.xc; }
        const sign = /[-−–]/.test(m[2]) || /-/.test(m[4] || '') ? -1 : (/\+/.test(m[2]) || /\+/.test(m[4] || '') ? 1 : 0);
        amts.push({ val: Math.abs(val), sign, x, li, full: m[0] });
      }
    });
    let cands = amts;
    const h = b.header;
    if (h && h.saldo != null) cands = cands.filter(a => a.x == null || !(Math.abs(a.x - h.saldo) < Math.min(h.out != null ? Math.abs(a.x - h.out) : 1e9, h.inc != null ? Math.abs(a.x - h.inc) : 1e9)));
    if (!cands.length) continue;
    const a = cands[0];
    let desc = b.lines.map(l => l.text).join(' ');
    desc = desc.replace(new RegExp(DATE_RE.source, 'gi'), ' ');
    AMT_RE.lastIndex = 0; desc = desc.replace(AMT_RE, '$1 ');
    desc = desc.replace(/\b(EUR|€)\b/g, ' ').replace(/\s+/g, ' ').replace(/^[\s\-–|:;,.]+|[\s\-–|:;,]+$/g, '').trim();
    if (/^(saldo|totale|riporto)|saldo (iniziale|finale|contabile|disponibile|al)|totale (movimenti|uscite|entrate)/i.test(desc)) continue;
    let sign = a.sign;
    if (!sign && h && a.x != null && h.out != null && h.inc != null) sign = Math.abs(a.x - h.inc) < Math.abs(a.x - h.out) ? 1 : -1;
    if (!sign) sign = POS_RE.test(desc) ? 1 : -1;
    if (!a.val) continue;
    out.push({ d: b.date, a: round2(sign * a.val), s: desc.slice(0, 220) || '(senza descrizione)' });
  }
  return out;
}
function finalizeParsed(list) {

    const base = `${t.d}|${(+t.a).toFixed(2)}|${norm(t.s).slice(0, 60)}`; seen[base] = (seen[base] || 0) + 1; t.h = base + '#' + seen[base];

  });

}

/* ---------- Investimenti: grafico versato / valore ---------- */
function invSeries(list) {
  const today = todayStr();
  const flows = list.flatMap(x => x.c.flows).sort(byDate);
  const ver = []; let cum = 0;
  flows.forEach(f => { cum += f.a; if (ver.length && ver[ver.length - 1][0] === f.d) ver[ver.length - 1][1] = cum; else ver.push([f.d, cum]); });
  const dates = new Set([today]);
  list.forEach(x => x.c.obs.forEach(o => dates.add(o[0])));
  const val = [];
  [...dates].sort().forEach(d => {
    if (d > today) return;
    let tot = 0, ok = true, any = false;
    for (const { inv, c } of list) {

      any = true;

      const p = priceAtObs(c.obs, d); const u = p == null ? null : unitsAt(inv, d, c.flows, c.obs);

}

/* ---------- Spese che si ripetono: le trovo nei movimenti e propongo di renderle automatiche ---------- */
const REC_NOM = { m: 30.44, b: 60.9, q: 91.3, s: 182.6, y: 365.25 };
const REC_SKIP_CATS = new Set(['spesa', 'ristoranti', 'svago', 'shopping', 'contanti', 'regali', 'giroconti', 'investimenti', 'da-classificare']);
const REC_GENERIC = new Set(['canone', 'opzione', 'commissioni', 'commissione', 'imposta', 'spese', 'spesa', 'addebito', 'pagamento', 'rata', 'quota', 'abbonamento', 'servizio', 'mensile', 'trimestrale', 'annuale', 'internet', 'banking']);
const recClean = s => norm(s).replace(/\b(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre|mese|mesi|periodo|rif|liq)\b/g, ' ');
function recKey(s) { const toks = sigTokens(recClean(s)); return toks.filter(w => !REC_GENERIC.has(w))[0] || toks[0] || ''; }
function recName(s) {
  const raw = String(s || '').replace(/\b(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\b/gi, ' ').replace(/\s+/g, ' ').trim();
  if (raw.length <= 40 && /[a-zà-ÿ]/.test(raw) && !/\d{2}\/\d{2}/.test(raw)) return raw;
  return sigTokens(recClean(raw)).filter(w => !['revolut', 'paypal', 'satispay', 'sdd', 'addebito', 'pagamento', 'europe', 'italia'].includes(w)).slice(0, 3).join(' ').replace(/\b\w/g, ch => ch.toUpperCase()) || raw.slice(0, 40);
}
function recurringProposals() {
  if (!S.settings) return [];
  const today = todayStr(); const ign = new Set(S.settings.recIgn || []);
  const fixedKeys = (S.settings.fixed || []).map(f => ({ k: recKey(f.n || ''), toks: sigTokens(f.n || '') }));
  const groups = new Map();
  allTx().forEach(t => {
    if (t.a >= 0 || t.tr || t.auto || t.fx || t.fee || REC_SKIP_CATS.has(t.c) || catById(t.c).t !== 'out' || /\(\d+ op\.?\)/.test(t.s)) return;
    const k = recKey(t.s); if (!k) return;
    (groups.get(k) || groups.set(k, []).get(k)).push(t);
  });
  const out = [];
  for (const [k, list] of groups) {
    if (ign.has(k) || fixedKeys.some(f => f.k === k || f.toks.includes(k))) continue;
    // gruppi per importo simile (ogni importo entro il 7% del precedente, e in tutto non più del 12% di differenza)
    const byA = list.slice().sort((a, b) => b.a - a.a); const clusters = [];
    byA.forEach(t => { const c = clusters[clusters.length - 1]; const a = -t.a; if (c && Math.abs(a - c.last) <= Math.max(0.05, c.last * 0.07) && a <= c.min * 1.12 + 0.05) { c.items.push(t); c.last = a; } else clusters.push({ min: a, last: a, items: [t] }); });
    for (const c of clusters) {
      const ts = c.items.slice().sort(byDate); const dates = [];
      ts.forEach(t => { if (!dates.length || daysBetween(dates[dates.length - 1], t.d) > 5) dates.push(t.d); });
      if (dates.length < 2) continue;
      const iv = dates.slice(1).map((d, i) => daysBetween(dates[i], d)); const sv = iv.slice().sort((a, b) => a - b), mi = Math.floor(sv.length / 2); const med = sv.length % 2 ? sv[mi] : (sv[mi - 1] + sv[mi]) / 2;
      const f = Object.keys(REC_NOM).sort((x, y) => Math.abs(Math.log(med / REC_NOM[x])) - Math.abs(Math.log(med / REC_NOM[y])))[0];
      if (med / REC_NOM[f] < 0.6 || med / REC_NOM[f] > 1.5) continue;
      const nom = REC_NOM[f]; const okN = iv.filter(x => x / nom >= 0.6 && x / nom <= 1.5).length;
      const need = f === 's' || f === 'y' ? 2 : 3;
      if (dates.length < need || okN < Math.max(1, Math.ceil(iv.length * 2 / 3))) continue;
      // con solo due volte voglio importo identico e distanza quasi giusta, altrimenti è probabile che manchino dei dati
      if (dates.length === 2) { const as = c.items.map(t => -t.a); if (Math.max(...as) > Math.min(...as) * 1.01 + 0.01 || Math.abs(iv[0] / nom - 1) > 0.15) continue; }
      const lastT = ts[ts.length - 1]; if (daysBetween(lastT.d, today) > nom * 1.6) continue;
      const acct = lastT.ac && acctById(lastT.ac) ? lastT.ac : ((S.settings.accts || []).find(a => norm(a.n) === norm(lastT.k)) || {}).id || null;
      let next = lastT.d; for (let i = 0; i < 40 && next <= today; i++) { const ym = addMonths(next.slice(0, 7), FREQ_MONTHS[f]); next = `${ym}-${pad2(Math.min(+lastT.d.slice(8), dimOf(ym)))}`; }
      const nm = recName(lastT.s);
      out.push({ key: k, n: nm, a: round2(-lastT.a), f, c: lastT.c, ac: acct, from: next, count: dates.length, last: lastT.d });
      break;
    }
  }
  return out.sort((a, b) => FREQ_MONTHS[a.f] - FREQ_MONTHS[b.f] || b.a - a.a).slice(0, 6);
}
function fixedCard() {
  const fx = (S.settings.fixed || []).slice().sort((a, b) => (fixedNext(a) || '9') < (fixedNext(b) || '9') ? -1 : 1);
  const props = S.recList = recurringProposals();
  const rows = fx.map(f => { const nx = fixedNext(f); const ac = acctById(f.ac); const ended = isDate(f.to) && f.to < todayStr();

async function shrinkImage(file, max = 1600) {
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
    if (k >= 1 && file.size < 1.5e6) { URL.revokeObjectURL(url); return file; }
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.85));
  } catch (e) { return file; }
}

  P.busy = true; P.recent = 0; P.done = false; P.credits = 0;
  P.items.forEach(x => { if (x.st !== 'ok' && x.st !== 'saved') { x.st = 'wait'; x.why = ''; } });
  renderPU();
  const ctx = { credits: 0, fx: {} };
  const queue = P.items.filter(x => x.st === 'wait'); let fatal = '';
  const worker = async () => {
    while (queue.length) {
      const it = queue.shift(); const inv = S.settings.invs.find(i => i.id === it.id); if (!inv) continue;
      if (fatal) { it.st = 'manual'; it.why = fatal; puRow(it); continue; }
      it.st = 'run'; puRow(it);
      try {
        const r = await findPrice(inv, ctx, it.last);
        if (r.st !== 'ok') { it.st = 'manual'; it.why = r.why; }
        else if (it.last && r.d < it.last.d) { it.st = 'same'; it.r = r; it.why = `Il valore trovato (${fmtDs(r.d)}) è più vecchio di quello che hai già.`; }
        else if (it.last && r.d === it.last.d && Math.abs(r.p - it.last.p) / it.last.p < 0.0005) { it.st = 'same'; it.r = r; }
        else {
          const thr = inv.str === 'Crypto' || inv.sym ? 0.4 : 0.15;
          it.r = r;
          if (it.last && Math.abs(r.p / it.last.p - 1) > thr) it.st = 'confirm';
          else { applyPrice(inv, r); it.st = 'ok'; P.ok++; }
        }
      } catch (e) {
        if (e && PU_FATAL[e.code]) { fatal = PU_FATAL[e.code]; P.fatal = fatal; }
        it.st = 'manual'; it.why = fatal || 'Ricerca non riuscita: riprova più tardi o inserisci il valore.';
      }
      puRow(it);
    }
  };
  await Promise.all([worker(), worker()]);
  P.credits = ctx.credits; P.busy = false; P.done = true;
  if (P.ok || P.items.some(x => x.st === 'same')) {
    S.prices = S.prices || {}; S.prices.run = { at: new Date().toISOString(), ok: P.ok, err: P.items.filter(x => x.st === 'manual').map(x => (S.settings.invs.find(i => i.id === x.id) || {}).n + ': ' + (x.why || 'non trovato')).slice(0, 10), by: 'app' };
    Store.savePrices();
  }
  if ($('#pu-sheet')) renderPU();
  render();
  if (P.ok) toast(`Aggiornati ${P.ok} ${P.ok === 1 ? 'valore' : 'valori'}`, true);
}
function puStatus(it, inv) {
  const r = it.r; const ch = r && it.last ? r.p / it.last.p - 1 : null;
  switch (it.st) {
    case 'idle': return it.last ? `Ultimo valore ${eurP(it.last.p)} del ${fmtDs(it.last.d)}` : 'Nessun valore ancora';
    case 'wait': return 'In coda…';
    case 'run': return '<span class="spin" aria-hidden="true"></span> Cerco il valore di oggi…';
    case 'ok': return `<span class="chip good">✓</span> ${eurP(r.p)} al ${fmtDs(r.d)}${ch != null ? ` <span class="${tone(ch)}">${pctS(ch)}</span>` : ''} <span class="sub">· ${esc(r.src)}</span>`;
    case 'saved': return `<span class="chip good">✓</span> ${eurP(it.manual.p)} al ${fmtDs(it.manual.d)} <span class="sub">· inserito da te</span>`;
    case 'same': return `Già aggiornato: ${eurP((it.last || r).p)} al ${fmtDs((it.last || r).d)}${it.why ? `<br><span class="sub">${esc(it.why)}</span>` : ''}`;
    case 'confirm': return `<span class="chip warn">!</span> Trovato ${eurP(r.p)} al ${fmtDs(r.d)}: <b class="${tone(ch)}">${pctS(ch)}</b> rispetto all'ultimo (${eurP(it.last.p)}). È molto diverso: è giusto?<br><span class="sub">${esc(r.src)}</span>`;
    case 'manual': return `${it.why ? `<span class="sub">${esc(it.why)}</span><br>` : ''}Scrivi il valore di una quota come lo vedi nell'app della banca:`;

}

    case 'catname': { const c = s.cats.find(x => x.id === el.dataset.v); const n = el.value.trim().slice(0, 40); if (!c || !n || c.id === 'da-classificare') { render(); return; } c.n = n; Store.saveSettings(); render(); toast('Categoria rinominata', true); break; }

    case 'imphead': S.imp.headerIdx = Math.max(0, Math.min(S.imp.rows.length - 1, (parseInt(el.value) || 1) - 1)); S.imp.map = guessMap(S.imp.rows[S.imp.headerIdx]); S.imp.sig = (S.imp.rows[S.imp.headerIdx] || []).map(norm).join('|'); reparse(); break;
    case 'impacct': S.imp.acct = el.value.trim() || 'Conto'; S.imp.parsed.forEach(t => t.k = S.imp.acct); break;
    case 'impmap': S.imp.map[el.dataset.f] = +el.value; reparse(); break;
    case 'impmode': S.imp.map.mode = el.value; reparse(); break;
    case 'impinv': S.imp.invert = el.checked; reparse(); break;
    case 'impinvtext': S.imp.invert = el.checked; S.imp.parsed.forEach(flipTx); finalizeParsed(S.imp.parsed); render(); break;
    case 'impcat': { const t = S.imp.parsed.find(x => x.id === el.dataset.v); if (t) { t.c = el.value; delete t._mem; render(); } break; }
  }
});
$('#file').addEventListener('change', e => { const fs = [...e.target.files]; if (fs.length > 1 && fs.every(f => /^image\//.test(f.type))) handleImages(fs); else handleFile(fs[0]); e.target.value = ''; });
document.addEventListener('paste', e => {
  if (!e.target || e.target.id !== 'paste') return;
  const files = [...((e.clipboardData && e.clipboardData.files) || [])];
  if (files.length) { e.preventDefault(); if (files.every(f => /^image\//.test(f.type))) handleImages(files); else handleFile(files[0]); return; }
  setTimeout(() => { const ta = $('#paste'); if (ta && ta.value.trim().length > 30) readPasted(); }, 60);
});
$('#restore').addEventListener('change', e => { handleRestoreFile(e.target.files[0]); e.target.value = ''; });
$('#realignfile').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) realignFiles(fs); });
$('#receiptfile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) handleReceipt(f); });
// Trascina un estratto conto in qualsiasi punto della pagina per importarlo
let dragN = 0;
const hasFiles = e => !!(e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files'));
const dropOn = on => { const z = $('#dropzone'); if (z) z.hidden = !on; const d = $('#drop'); if (d) d.classList.toggle('over', on); };
document.addEventListener('dragenter', e => { if (!hasFiles(e) || S.onb) return; e.preventDefault(); dragN++; dropOn(true); });
document.addEventListener('dragover', e => { if (!hasFiles(e) || S.onb) return; e.preventDefault(); });
document.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragN = Math.max(0, dragN - 1); if (!dragN) dropOn(false); });
document.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragN = 0; dropOn(false); if (S.onb) return; const fs = [...e.dataTransfer.files]; if (!fs.length) return; if (fs.length > 1 && fs.every(f => /^image\//.test(f.type))) handleImages(fs); else handleFile(fs[0]); });
document.addEventListener('keydown', e => {
  if (Lock.on) { if (/^[0-9]$/.test(e.key)) { e.preventDefault(); lockKey(e.key); } else if (e.key === 'Backspace') { e.preventDefault(); lockDel(); } return; }
  if (e.key === 'Escape' && $('#overlay').innerHTML) closeSheet();
});
let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (S.onb) return; S.anim = false; if (S.view === 'home') drawMonthly(); if (S.view === 'inv') drawInvTotal(); if (S.view === 'tx') drawCatChart(); }, 150); });
// Quando riapri l'app registro le rate dei PAC scadute nel frattempo
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Lock.hiddenAt = Date.now(); return; }
  if (lockSet() && Lock.hiddenAt && Date.now() - Lock.hiddenAt > 60000) showLock();
  Lock.hiddenAt = 0;
  if (!S.demo && !S.onb && autoRun()) render();
});

/* ---------- Avvio ---------- */
(function boot() {
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js'); } catch (e) {}
  applyTheme();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}
  try { new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  setInterval(applyTheme, 60000);
  S.period = lsGet('fp-period') === 'year' ? 'year' : 'month';
  S.retMode = lsGet('fp-ret') === 'ann' ? 'ann' : 'tot';
  S.settings = defaultSettings(); const demo = demoData(); S.settings = demo.settings; S.months = demo.months; S.demo = true;
  render();
  (async () => {
    if (window.FP_AUTH) await window.FP_AUTH();
    await Store.init();
    const data = await Store.loadAll();
    S.prices = data.prices || null;
    const hasData = data.settings && (data.settings.started || Object.keys(data.months).length);
    if (hasData) {
      const raw = JSON.parse(JSON.stringify(data.settings));
      S.settings = normalizeSettings(data.settings); S.months = data.months; S.demo = false;
      const mw = monthsWithData(); const cur = todayStr().slice(0, 7);
      S.ym = mw.includes(cur) || !mw.length ? cur : mw[mw.length - 1];
      migrateV2(raw); migrateV22(raw);
      showLock();
    } else if (Object.keys(data.months || {}).length) {
      S.settings = defaultSettings(); S.months = data.months; S.demo = false;
    } else S.onb = { step: 1, accts: [], t: 'cc' };
    try { const sample = window.claude && await window.claude.use('sample'); S.aiAvail = !!sample; } catch (e) { S.aiAvail = false; }
    applyTheme();
    try { const dl = window.claude && await window.claude.use('downloads'); S.dlAvail = !!dl; } catch (e) { S.dlAvail = false; }
    if (!S.demo) { autoRun(); if ((S.months[nowYm()] || []).length) S.ym = nowYm(); }
    S.lastKey = null; render();
    Store.subscribe();
  })();
})();
</script>
